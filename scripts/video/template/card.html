<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; background: transparent; font-family: var(--font-body); }
  .frame { position: absolute; inset: 0; padding: 140px 160px; display: flex; flex-direction: column; justify-content: flex-end; gap: 32px; }
  .title, .end { background: var(--cover); color: var(--cover-ink); }
  .title::before, .end::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(55% 60% at 85% 25%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%),
      radial-gradient(60% 60% at 5% 90%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%);
  }
  .frame > * { position: relative; }
  .logo { position: absolute; top: 120px; left: 160px; height: 56px; color: var(--cover-ink); }
  .kicker { font: 500 34px/1 var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
  h1 { font: var(--display-weight) 150px/1 var(--font-display); letter-spacing: -0.02em; max-width: 1500px; text-wrap: balance; }
  p { font-size: 44px; opacity: 0.8; }
  .caption h1, .caption .kicker, .caption .logo, .title p:empty, .end .kicker:empty { display: none; }
  .caption { padding-bottom: 110px; }
  .caption p {
    align-self: flex-start; max-width: 1300px; opacity: 1;
    font: 500 46px/1.3 var(--font-body); color: #fff;
    background: rgba(0, 0, 0, 0.62); padding: 22px 34px; border-radius: 14px;
    border-left: 8px solid var(--accent);
  }
</style>
</head>
<body>
  <main class="frame {{mode}}">
    <p class="kicker">{{kicker}}</p>
    <h1>{{title}}</h1>
    <p>{{text}}</p>
  </main>
</body>
</html>
